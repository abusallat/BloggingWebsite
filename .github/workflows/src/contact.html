<!DOCTYPE html>

  <header>
    <h1>Contact Us</h1>
    <nav>

      </ul>
    </nav>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <form>
        <label for="name">Name:</label>
        <input id="name" type="text" name="name">

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
